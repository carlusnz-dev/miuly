<header>
  <a class="skip-link" href="#conteudo">Ir para o conteúdo</a>
  <nav aria-label="Conta">
    @if (session.isAuthenticated()) {
      <button type="button" [disabled]="signingOut()" (click)="logout()">
        {{ signingOut() ? 'Saindo…' : 'Sair' }}
      </button>
      @if (logoutError()) {
        <span class="logout-error" role="alert">Não foi possível sair. Tente novamente.</span>
      }
    } @else if (session.status() === 'checking') {
      <span role="status">Verificando sessão…</span>
    } @else if (session.status() === 'unavailable') {
      <span role="status">Sem conexão com a sessão.</span>
    }
  </nav>
</header>
