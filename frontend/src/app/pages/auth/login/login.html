<div
  class="w-full h-full px-6 sm:px-3 md:px-0 min-h-screen flex flex-col justify-center items-center"
>
  <h1 class="fixed top-5 text-6xl md:text-4xl font-light text-zinc-300">
    Miuly
  </h1>

  <div
    class="w-full max-w-lg px-5 py-6 space-y-3 flex flex-col border-2 border-zinc-700 rounded-2xl"
  >
    <h1 class="text-4xl font-bold text-center">Entre agora</h1>
    <p class="text-lg font-medium text-zinc-600 text-center">
      e aproveite todos os benefícios do app
    </p>

    <form
      class="relative my-3 px-2.5"
      [formGroup]="loginForm"
      tuiForm="l"
      (ngSubmit)="onSubmit()"
    >
      <tui-textfield>
        <label for="identifier" tuiLabel>Nome ou e-mail</label>
        <input
          id="identifier"
          type="text"
          placeholder="Insira o nome ou e-mail"
          formControlName="identifier"
          tuiInput
        />
      </tui-textfield>
      <tui-error formControlName="identifier" />

      <tui-textfield>
        <label for="password" tuiLabel>Senha</label>
        <input
          id="password"
          type="password"
          placeholder="Insira a senha"
          formControlName="password"
          tuiInput
        />
      </tui-textfield>
      <tui-error formControlName="password" />

      <button
        class="w-full"
        type="submit"
        [disabled]="loginForm.invalid"
        tuiButton
      >
        Entrar
      </button>
      <tui-error [error]="erroApi()" class="text-center" />
    </form>
    <p class="text-center font-medium text-zinc-500">
      Não possui uma conta?
      <a
        class="text-blue-700 hover:text-blue-700/50 hover:underline underline-offset-4 transition-colors"
        routerLink="/signup"
        >Crie agora</a
      >
    </p>
  </div>
</div>
